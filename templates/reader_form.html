{% extends 'base.html' %}{% block content %}<section class="formcard"><h1>{{'Sửa bạn đọc' if reader else 'Thêm bạn đọc'}}</h1><form method="post" class="formgrid"><label>Mã bạn đọc<input name="code" value="{{reader.code if reader else ''}}" required></label><label>Họ tên<input name="name" value="{{reader.name if reader else ''}}" required></label><label>Lớp<input name="class_name" value="{{reader.class_name if reader else ''}}"></label><label>Số điện thoại<input name="phone" value="{{reader.phone if reader else ''}}"></label><label>Loại<input name="type" value="{{reader.type if reader else 'Học sinh'}}"></label><div class="full"><button class="btn">Lưu</button> <a class="btn light" href="{{url_for('readers')}}">Hủy</a></div></form></section>{% endblock %}
