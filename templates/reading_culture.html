{% extends 'base.html' %}{% block content %}<div class="pagehead"><h1>🏆 Văn hóa Đọc</h1><a class="btn" href="{{url_for('classes')}}">🏫 Theo lớp</a></div><section class="card"><form class="search"><select name="class"><option value="">Toàn trường</option>{% for c in classes %}<option value="{{c}}" {% if selected_class==c %}selected{% endif %}>{{c}}</option>{% endfor %}</select><button>Lọc</button></form><table><tr><th>Hạng</th><th>Bạn đọc</th><th>Lớp</th><th>Đã đọc</th><th>Điểm</th><th>Huy hiệu</th><th></th></tr>{% for x in rows %}<tr><td><b>#{{x.rank}}</b></td><td>{{x.reader.name}}</td><td>{{x.reader.class_name or '—'}}</td><td>{{x.books}}</td><td><b>{{x.points}}</b></td><td>{{x.badges}}</td><td><a class="btn mini" href="{{url_for('reading_profile',reader_id=x.reader.id)}}">Hồ sơ</a></td></tr>{% else %}<tr><td colspan="7">Chưa có dữ liệu.</td></tr>{% endfor %}</table></section>{% endblock %}
