{% extends 'base.html' %}{% block content %}<div class="pagehead"><h1>🗄️ Kệ sách</h1><a class="btn" href="{{url_for('add_shelf')}}">＋ Thêm kệ</a></div><section class="card"><table><tr><th>Mã</th><th>Tên</th><th>Khu</th><th>Ghi chú</th><th></th></tr>{% for s in shelves %}<tr><td>{{s.code}}</td><td>{{s.name}}</td><td>{{s.zone or ''}}</td><td>{{s.note or ''}}</td><td><a class="btn mini light" href="{{url_for('edit_shelf',shelf_id=s.id)}}">Sửa</a><form class="inline" method="post" action="{{url_for('delete_shelf',shelf_id=s.id)}}"><button class="danger mini">Xóa</button></form></td></tr>{% endfor %}</table></section>{% endblock %}
