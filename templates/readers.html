{% extends 'base.html' %}{% block content %}<div class="pagehead"><h1>👥 Bạn đọc</h1><a class="btn" href="{{url_for('add_reader')}}">＋ Thêm bạn đọc</a></div><form class="search"><input name="q" value="{{q}}" placeholder="Tìm mã, tên, lớp..."><button>Tìm</button></form><section class="card"><table><tr><th>Mã</th><th>Họ tên</th><th>Lớp</th><th>Đã đọc</th><th>Điểm</th><th>Thao tác</th></tr>{% for x in rows %}<tr><td>{{x.reader.code}}</td><td>{{x.reader.name}}</td><td>{{x.reader.class_name or ''}}</td><td>{{x.books}}</td><td>{{x.points}}</td><td><a class="btn mini" href="{{url_for('reader_detail',reader_id=x.reader.id)}}">Xem</a> <a class="btn mini" href="{{url_for('reading_profile',reader_id=x.reader.id)}}">📚 Hồ sơ đọc</a> <a class="btn mini light" href="{{url_for('edit_reader',reader_id=x.reader.id)}}">Sửa</a></td></tr>{% else %}<tr><td colspan="6">Chưa có bạn đọc.</td></tr>{% endfor %}</table></section>{% endblock %}
