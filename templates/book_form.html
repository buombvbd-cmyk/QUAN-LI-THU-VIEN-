{% extends 'base.html' %}{% block content %}<section class="formcard"><h1>{{'✏️ Sửa sách' if book else '➕ Thêm sách'}}</h1><form method="post" enctype="multipart/form-data" class="formgrid"><label>Mã sách<input name="code" value="{{book.code if book else ''}}" required></label><label>Tên sách<input name="title" value="{{book.title if book else ''}}" required></label><label>Tác giả<input name="author" value="{{book.author if book else ''}}"></label><label>Thể loại<input name="category" value="{{book.category if book else ''}}"></label><label>Nhà xuất bản<input name="publisher" value="{{book.publisher if book else ''}}"></label><label>Năm xuất bản<input name="year" type="number" value="{{book.year if book else ''}}"></label><label>Số lượng<input name="quantity" type="number" min="0" value="{{book.quantity if book else 1}}" required></label><label>Vị trí / Kệ<input name="location" value="{{book.location if book else ''}}"></label><label class="full">Ảnh bìa<input name="cover" type="file" accept=".jpg,.jpeg,.png,.webp">{% if book and book.cover %}<small>Đã có ảnh bìa: {{book.cover}}</small>{% endif %}</label><div class="full"><button class="btn">Lưu sách</button> <a class="btn light" href="{{url_for('books')}}">Hủy</a></div></form></section>{% endblock %}
