{% extends 'base.html' %}{% block content %}<section class="formcard"><h1>{{'Sửa sách' if book else 'Thêm sách'}}</h1><form method="post" class="formgrid"><label>Mã sách<input name="code" value="{{book.code if book else ''}}" required></label><label>Tên sách<input name="title" value="{{book.title if book else ''}}" required></label><label>Tác giả<input name="author" value="{{book.author if book else ''}}"></label><label>Thể loại<input name="category" value="{{book.category if book else ''}}"></label><label>Nhà xuất bản<input name="publisher" value="{{book.publisher if book else ''}}"></label><label>Năm<input name="year" type="number" value="{{book.year if book else ''}}"></label><label>Số lượng<input name="quantity" type="number" min="0" value="{{book.quantity if book else 1}}"></label><label>Vị trí<input name="location" value="{{book.location if book else ''}}"></label><div class="full"><button class="btn">Lưu</button> <a class="btn light" href="{{url_for('books')}}">Hủy</a></div></form></section>{% endblock %}
