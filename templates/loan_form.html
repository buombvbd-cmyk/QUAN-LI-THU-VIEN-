{% extends 'base.html' %}{% block content %}<section class="formcard"><h1>Lập phiếu mượn</h1><form method="post"><label>Sách<select name="book_id" required>{% for b in books %}<option value="{{b.id}}">{{b.code}} — {{b.title}} (còn {{b.quantity}})</option>{% endfor %}</select></label><label>Bạn đọc<select name="reader_id" required>{% for r in readers %}<option value="{{r.id}}">{{r.code}} — {{r.name}}{% if r.class_name %} — {{r.class_name}}{% endif %}</option>{% endfor %}</select></label><label>Số ngày mượn<input type="number" name="days" value="14" min="1"></label><button class="btn">Xác nhận mượn</button></form></section>{% endblock %}
